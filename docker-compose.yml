services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tshirt_store
      POSTGRES_PASSWORD: tshirt_store
      POSTGRES_DB: tshirt_store
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tshirt_store']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
